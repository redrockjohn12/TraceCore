plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atlastechnologies.tracecore'
    compileSdk 34

    defaultConfig {
        applicationId 'com.atlastechnologies.tracecore'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '10.0.0'

        buildConfigField 'String', 'TRACECORE_BASE_URL', '"http://127.0.0.1:3000/"'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
